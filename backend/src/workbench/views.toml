# Curated virtual relations and table views; workbench.toml can add more or override fields of
# these with [virtual.<id>] and [views.<id>] tables.
#
# Virtual relations (relations.py) name a path over ontology relations. They can be used wherever
# a relation can: relate/unrelate, the inspector, the assistant, and view column paths
# (virtual:<id>). One with a `via` class can be set: relating two entities that share no middle
# node creates one (labelled by via_label) and links it both ways.
#
# Views are the project's tabs, in this order (Graph and Issues always follow). Rows are instances
# of the `rows` classes ("entity" = every generic entity), or the vocabulary terms under `terms`;
# columns are paths (see views.py), through the model or (source = "vocabulary") the ontologies.
# `table` makes a tab one of the typed tables; `builtin` adds columns to a typed table instead.
# `families` / `profiles` limit a view to some projects, `exclude_profiles` hides it from some.

# ------------------------------------------------------------------------- typed tables

[views.points]
label = "Points"
table = "points"

[views.equipment]
label = "Equipment"
table = "equipment"

[views.spaces]
label = "Spaces"
table = "spaces"
exclude_profiles = ["watr"]  # treatment plants are modeled by process, not by room

[views.connections]
label = "Connections"
table = "connections"

[views.connection_points]
label = "Connection points"
table = "connection_points"
families = ["s223"]  # Brick has none

# --------------------------------------------------------------------- virtual relations

# RealEstateCore adjacency: both spaces rec:adjacentElement one shared building element.
[virtual.adjacent]
label = "adjacent to"
description = "Spaces sharing a wall or other building element (RealEstateCore)"
families = ["brick"]
path = "rec:adjacentElement/^rec:adjacentElement"
via = "rec:Wall"
via_label = "Wall: {subject} | {object}"

# 223P: a zone serves a physical space through a domain space the physical space encloses.
[virtual.serves_space]
label = "serves space"
description = "Physical spaces a zone serves, through the domain space each one encloses (223P)"
families = ["s223"]
path = "s223:hasDomainSpace/^s223:encloses"
via = "s223:DomainSpace"
via_label = "{object} ({subject})"
via_copy = ["s223:hasDomain"]

# ------------------------------------------------------------------ Brick / RealEstateCore

[views.building_elements]
label = "Building elements"
families = ["brick"]
rows = ["rec:BuildingElement"]
columns = [
  { key = "label", label = "Element", path = "label", editor = "label" },
  { key = "type", label = "Type", path = "type", editor = "type" },
  { key = "adjacent", label = "Adjacent spaces", path = "^rec:adjacentElement", editor = "relation" },
  { key = "intersecting", label = "Intersecting spaces", path = "^rec:intersectingElement", editor = "relation" },
  { key = "part_of", label = "Part of", path = "rec:isPartOf", editor = "relation" },
]

# --------------------------------------------------------------------------- 223P / WaTr

[views.zones]
label = "Zones"
families = ["s223"]
exclude_profiles = ["watr"]
rows = ["s223:Zone"]
columns = [
  { key = "label", label = "Zone", path = "label", editor = "label" },
  { key = "type", label = "Type", path = "type", editor = "type" },
  { key = "domain", label = "Domain", path = "s223:hasDomain", editor = "relation" },
  { key = "domain_spaces", label = "Domain spaces", path = "s223:hasDomainSpace", editor = "relation" },
  { key = "spaces", label = "Physical spaces", path = "virtual:serves_space", editor = "relation" },
]

[views.domain_spaces]
label = "Domain spaces"
families = ["s223"]
exclude_profiles = ["watr"]
rows = ["s223:DomainSpace"]
columns = [
  { key = "label", label = "Domain space", path = "label", editor = "label" },
  { key = "domain", label = "Domain", path = "s223:hasDomain", editor = "relation" },
  { key = "enclosed_by", label = "Enclosed by", path = "^s223:encloses", editor = "relation" },
  { key = "zone", label = "Zone", path = "^s223:hasDomainSpace", editor = "relation" },
]

# ------------------------------------------------------------------------------- WaTr

# Every treatment process the vocabulary knows, with the equipment that performs it here.
[views.processes]
label = "Processes"
profiles = ["watr"]
terms = "watr:Process"
columns = [
  { key = "label", label = "Process", path = "label" },
  { key = "kind", label = "Kind of process", path = "rdfs:subClassOf", source = "vocabulary" },
  { key = "equipment", label = "Equipment", path = "^watr:hasProcess", editor = "relation" },
  { key = "about", label = "Description", path = "rdfs:comment", source = "vocabulary" },
]

# The kinds of water the vocabulary knows (brackish, brine, freshwater...), what carries them and
# what measures them here.
[views.media]
label = "Media"
profiles = ["watr"]
terms = "s223:Fluid-Water"
columns = [
  { key = "label", label = "Medium", path = "label" },
  { key = "constituents", label = "Made of", path = "s223:composedOf/s223:ofConstituent", source = "vocabulary" },
  { key = "carried_by", label = "Carried by", path = "^s223:hasMedium", editor = "relation", only = "s223:Connection" },
  { key = "measured_by", label = "Measured by", path = "^s223:ofMedium" },
]

# ---------------------------------------------------------------------------- every family

[views.other]
label = "Other things"
rows = ["entity"]
columns = [
  { key = "label", label = "Name", path = "label", editor = "label" },
  { key = "type", label = "Type", path = "type", editor = "type" },
  { key = "relations", label = "Relationships", path = "relations" },
]

# ------------------------------------------------------------------ typed-table extensions

[views.space_adjacency]
label = "Adjacency"
families = ["brick"]
builtin = "spaces"
columns = [
  { key = "adjacent", label = "Adjacent spaces", path = "virtual:adjacent", editor = "relation" },
]

[views.space_zones]
label = "Zones"
families = ["s223"]
exclude_profiles = ["watr"]
builtin = "spaces"
columns = [
  { key = "zones", label = "Zones", path = "^virtual:serves_space", editor = "relation" },
]
